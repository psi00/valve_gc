name: Integration Release

on:
  push:
    branches: [ "integration" ]
  workflow_dispatch:

concurrency:
  group: integration-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022

    env:
      SCCACHE_GHA_ENABLED: "true"

    steps:
    - uses: actions/checkout@v4

    - name: Run sccache-cache
      uses: mozilla-actions/sccache-action@v0.0.9

    - name: Setup MSVC (x64)
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: amd64

    - name: Build Windows (x64)
      run: |
        mkdir ${{ github.workspace }}/release
        cmake -G Ninja -B ${{ github.workspace }}/build_x64 -DCMAKE_BUILD_TYPE=Release -S ${{ github.workspace }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DOUTDIR=${{ github.workspace }}/release
        cmake --build ${{ github.workspace }}/build_x64 --target cs2 csgo_gc tf tf2_gc

    - name: Package
      shell: bash
      run: |
        cp $GITHUB_WORKSPACE/README.md $GITHUB_WORKSPACE/release/
        mkdir $GITHUB_WORKSPACE/release/licenses
        cp $GITHUB_WORKSPACE/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-csgo_gc.txt
        cp $GITHUB_WORKSPACE/build_x64/_deps/cryptopp-cmake-build/cryptopp/License.txt $GITHUB_WORKSPACE/release/licenses/LICENSE-crypto++.txt
        cp $GITHUB_WORKSPACE/build_x64/_deps/distorm-src/COPYING $GITHUB_WORKSPACE/release/licenses/LICENSE-distorm.txt
        cp $GITHUB_WORKSPACE/build_x64/_deps/funchook-src/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-funchook.txt
        cp $GITHUB_WORKSPACE/build_x64/_deps/protobuf-src/LICENSE $GITHUB_WORKSPACE/release/licenses/LICENSE-protobuf.txt
        cp $GITHUB_WORKSPACE/examples/config.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/inventory.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/price_sheet.txt $GITHUB_WORKSPACE/release/csgo_gc/
        cp $GITHUB_WORKSPACE/examples/unusual_loot_lists.txt $GITHUB_WORKSPACE/release/csgo_gc/
        mkdir -p $GITHUB_WORKSPACE/release/tf2_gc
        cp $GITHUB_WORKSPACE/examples/tf2_config.txt $GITHUB_WORKSPACE/release/tf2_gc/config.txt
        cp $GITHUB_WORKSPACE/examples/tf2_items_game.txt $GITHUB_WORKSPACE/release/tf2_gc/
        cp $GITHUB_WORKSPACE/examples/tf2_unusual_inventory.txt $GITHUB_WORKSPACE/release/tf2_gc/tf2_inventory.txt

    - name: Zip artifacts (Windows)
      shell: pwsh
      env:
        OUTNAME: csgo_gc-integration-win64.zip
      run: |
        $out = Join-Path $env:GITHUB_WORKSPACE $env:OUTNAME
        if (Test-Path $out) { Remove-Item $out -Force }
        Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'release\*') -DestinationPath $out -Force
        Get-ChildItem $out

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: integration-win64
        path: ${{ github.workspace }}/csgo_gc-integration-win64.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create integration test release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          TAG=integration-latest
          files=( $(find artifacts -type f -name "*.zip") )

          if [ ${#files[@]} -gt 0 ]; then
            gh release delete "$TAG" --cleanup-tag --repo "$REPO" --yes || true
            gh api --method DELETE "repos/$REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true

            # kludge to avoid the release being created as a draft...
            sleep 10s

            gh release create "$TAG" --repo "$REPO" \
              --title "Integration test build" \
              --notes "Automated build of the \`integration\` branch for testers.

          Commit: $SHA
          Branch: integration

          Download the Windows x64 zip below. This is a prerelease and may be unstable." \
              --prerelease \
              --target "$SHA"

            gh release upload "$TAG" --repo "$REPO" "${files[@]}" --clobber
          fi
